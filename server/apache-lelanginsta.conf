# Apache vhost untuk server penarik Lelang Insta.
#
# Pasang:
#   sudo cp apache-lelanginsta.conf /etc/apache2/sites-available/lelanginsta-api.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite lelanginsta-api
#   sudo systemctl reload apache2
#   sudo certbot --apache -d api.lelanginsta.masbash.id
#
# Ganti nama host di bawah ini kalau memakai domain lain, dan arahkan
# A record-nya ke IP VPS lebih dulu.

<VirtualHost *:80>
    ServerName api.lelanginsta.masbash.id

    # Certbot akan menambahkan pengalihan ke HTTPS sendiri di sini.
    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8791/
    ProxyPassReverse /  http://127.0.0.1:8791/

    # Alamat asli pemanggil dibutuhkan pembatas laju di aplikasinya;
    # tanpa ini semua permintaan terlihat datang dari Apache sendiri.
    #
    # CATATAN: Apache menambahkan alamat asli di BELAKANG isi X-Forwarded-For
    # yang sudah ada, jadi nilai paling kiri bisa dikarang pemanggil. Aplikasi
    # sengaja membaca yang paling kanan.
    RemoteIPHeader X-Forwarded-For

    # Tanpa daftar proxy tepercaya, mod_remoteip menerima X-Forwarded-For yang
    # DIKARANG pemanggil sebagai alamat aslinya — dan setiap permintaan dengan
    # header berbeda terhitung alamat berbeda, jadi seluruh pembatas laju
    # (termasuk penjaga tebak-sandi) tidak membatasi apa pun.
    RemoteIPTrustedProxy 127.0.0.1

    # Header keamanan. Ini API JSON yang tidak pernah dibingkai dan tidak
    # pernah dibuka langsung sebagai halaman, jadi ketiganya murni penutup
    # celah yang tidak dipakai — tidak ada yang bisa rusak karenanya.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    # HSTS hanya untuk nama host ini; sengaja TANPA includeSubDomains, karena
    # domain induknya dipakai layanan lain yang bukan urusan berkas ini.
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/lelanginsta-error.log
    CustomLog ${APACHE_LOG_DIR}/lelanginsta-access.log combined
</VirtualHost>
